<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark 40 - Jarvis AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background-color: #050b14;
            color: #00ffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(0, 20, 40, 0.9);
            border-bottom: 2px solid #00ffff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
        }
        #status-box {
            background: rgba(0, 30, 60, 0.9);
            border: 1px solid #00ffff;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            max-width: 90%;
            font-size: 1rem;
            min-height: 60px;
        }
        .arc-reactor {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffff 0%, #004466 60%, #020b14 100%);
            border: 4px solid #00ffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 35px #00ffff, inset 0 0 20px #00ffff;
            animation: pulseReactor 2s infinite alternate;
        }
        @keyframes pulseReactor {
            0% { transform: scale(1); box-shadow: 0 0 20px #00ffff; }
            100% { transform: scale(1.06); box-shadow: 0 0 45px #00ffff, 0 0 70px rgba(0,255,255,0.6); }
        }
        .arc-inner-icon {
            font-size: 2.5rem;
            color: #fff;
        }
        footer {
            width: 100%;
            padding: 15px;
            background: rgba(0, 10, 20, 0.9);
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
        }
        input[type="text"] {
            width: 70%;
            padding: 12px;
            background: #020b14;
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        button.send-btn {
            padding: 12px 20px;
            background: #00ffff;
            color: #050b14;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
    </style>
</head>
<body>

    <header>MARK 40 - JARVIS AI</header>

    <div class="main-container">
        <div id="status-box">
            سفیان سر، جارویس کا دماغ آن لائن ہے۔ آرک ری ایکٹر دبائیں اور بات کریں۔
        </div>

        <div class="arc-reactor" onclick="startListening()">
            <div class="arc-inner-icon">🎙️</div>
        </div>
    </div>

    <footer>
        <input type="text" id="user-input" placeholder="یہاں لکھ کر پوچھیں سفیان سر...">
        <button class="send-btn" onclick="processText()">ارسال</button>
    </footer>

    <script>
        function speak(text) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ur-PK';
            window.speechSynthesis.speak(utterance);
        }

        function startListening() {
            let statusBox = document.getElementById("status-box");
            statusBox.innerText = "جارویس سن رہا ہے، فرمائیے...";
            speak("جی سفیان بھائی، فرمائیے کیا حکم ہے؟");

            try {
                let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'ur-PK';
                recognition.onresult = function(event) {
                    let spokenText = event.results[0][0].transcript;
                    document.getElementById("user-input").value = spokenText;
                    statusBox.innerText = "آپ نے کہا: " + spokenText;
                    getAIResponse(spokenText);
                };
                recognition.start();
            } catch (e) {
                statusBox.innerText = "وائس سسٹم میں مسئلہ ہے، نیچے لکھ کر پوچھیں۔";
            }
        }

        function processText() {
            let txt = document.getElementById("user-input").value;
            if(txt) {
                document.getElementById("status-box").innerText = "سوچ رہا ہے: " + txt;
                getAIResponse(txt);
            }
        }

        function getAIResponse(query) {
            // یہاں جارویس آپ کے سوال کا خودکار اور ذہین جواب دے گا
            let reply = "سفیان بھائی، آپ نے کہا: '" + query + "'۔ مارک 40 پروجیکٹ اور آپ کے تمام احکامات پر سسٹم پوری طرح کاربند ہے۔";
            if(query.includes("کیسے ہو") || query.includes("كيف حالك")) {
                reply = "سفیان بھائی، آپ کا جارویس بالکل ٹھیک ہے اور آپ کی خدمت میں حاضر ہے۔";
            } else if(query.includes("مارک 40")) {
                reply = "مارک 40 ہمارا فلیگ شپ پروجیکٹ ہے سفیان سر، جو ہائی ٹیک آرک ری ایکٹر کے ساتھ لائیو ہے۔";
            }
            
            document.getElementById("status-box").innerText = reply;
            speak(reply);
        }
    </script>
</body>
</html>
