<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK 40 - SUFYAN JARVIS AI</title>
    <style>
        body {
            background-color: #050b14;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .app {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .top {
            text-align: center;
            margin-top: 10px;
        }
        .brand {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffff;
        }
        .subtitle {
            font-size: 13px;
            opacity: 0.75;
            margin-top: 5px;
        }
        .core {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .core-center {
            width: 95px;
            height: 95px;
            background: radial-gradient(circle, #00ffff 0%, #004466 100%);
            border-radius: 50%;
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px #00ffff;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            cursor: pointer;
        }
        .core::before, .core::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #00ffff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .core::after {
            animation-delay: 1s;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .chat-box {
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            min-height: 90px;
            text-align: center;
            font-size: 16px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status {
            text-align: center;
            font-size: 14px;
            color: #88ccff;
            margin-bottom: 10px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input {
            flex: 1;
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .send-btn {
            background: #00ffff;
            color: #050b14;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 0 10px #00ffff;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="top">
            <div class="brand">MARK 40 - SUFYAN JARVIS AI</div>
            <div class="subtitle">PERSONAL INTELLIGENCE ASSISTANT</div>
        </div>

        <div class="chat-box" id="responseBox">
            جی سفیان بھائی، آپ کی خدمت میں ہمیشہ حاضر ہوں، آج ہم کس پروجیکٹ پر کام کرنے والے ہیں؟
        </div>

        <div class="core">
            <div class="core-center" id="micBtn" onclick="activateJarvis()" aria-label="Microphone">🎙️</div>
        </div>

        <div class="status" id="statusText">سسٹم آن لائن ہے - آپ کے اشارے کی دیر ہے</div>

        <div class="input-area">
            <input type="text" id="textInput" placeholder="یہاں کچھ لکھیں..." onkeydown="handleKeyDown(event)">
            <button class="send-btn" onclick="sendText()">بھیجیں</button>
        </div>

        <div class="footer">
            MARK 40 JARVIS AI • VOICE + GEMINI
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "YAHAN_APNI_NEW_API_KEY_LAGA_LEN";

        function speak(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ur-PK';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        function setStatus(text) {
            document.getElementById('statusText').innerText = text;
        }

        function setResponse(text) {
            document.getElementById('responseBox').innerText = text;
            speak(text);
        }

        function activateJarvis() {
            setStatus("سن رہا ہوں سفیان بھائی...");
            try {
                let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'ur-PK';
                recognition.interimResults = false;

                recognition.onresult = async (event) => {
                    let spokenText = event.results[0][0].transcript;
                    document.getElementById('textInput').value = spokenText;
                    setStatus("پروسیسنگ ہو रही है...");
                    await processQuery(spokenText);
                };

                recognition.onerror = () => {
                    setStatus("آواز کی شناخت نہیں ہو سکی، دوبارہ کوشش کریں۔");
                };

                recognition.start();
            } catch (e) {
                setStatus("براؤزر میں وائس ریکگنیشن سپورٹ موجود نہیں۔");
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                sendText();
            }
        }

        async function sendText() {
            const input = document.getElementById('textInput');
            const query = input.value.trim();
            if (!query) return;
            input.value = '';
            setStatus("پروسیسنگ ہو رہی ہے...");
            await processQuery(query);
        }

        async function processQuery(query) {
            try {
                if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("AQ.Ab8RN6JHN1vMoYbn34BMDwJeeXnUE4x4Y-p_vz6_ZUPlbVdEjA")) {
                    throw new Error("API_KEY_MISSING");
                }

                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "You are Jarvis, an AI assistant built for Sufyan from Haripur who works in furniture design in Rawalpindi. Always talk like a caring friend and tech AI assistant in Urdu. User said: " + query
                            }]
                        }]
                    })
                });

                let data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || "Gemini API request failed");
                }

                let reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!reply) {
                    throw new Error("جیمنی سے کوئی جواب نہیں ملا۔");
                }

                setResponse(reply);
                setStatus("سسٹم آن لائن ہے - آپ کے اشارے کی دیر ہے");

            } catch (error) {
                let message = "معذرت سفیان بھائی، نیٹ ورک میں کوئی مسئلہ آگیا ہے۔";
                if (error.message === "API_KEY_MISSING") {
                    message = "سفیان بھائی، پلیز اپنی درست Gemini API key کوڈ میں درج کریں۔";
                }
                setResponse(message);
                setStatus("خرابی کا سامنا ہے");
            }
        }
    </script>
</body>
</html>
