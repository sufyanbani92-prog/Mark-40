<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK 40 - JAVASCRIPT INTERFACE</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: Arial, Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .app {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .top {
            text-align: center;
            margin-top: 10px;
        }
        .brand {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #58a6ff;
        }
        .core {
            position: relative;
            width: 200px;
            height: 200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .core-center {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #00ffff 0%, #0066cc 100%);
            border-radius: 50%;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
        }
        .core::before, .core::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px dashed rgba(0, 255, 255, 0.5);
            animation: pulse 4s infinite linear;
        }
        .core::after {
            width: 130%;
            height: 130%;
            animation-delay: 2s;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(0.9); opacity: 1; }
        }
        .status {
            text-align: center;
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .send-btn {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="top">
            <div class="brand">MARK 40 - JAVASCRIPT INTERFACE</div>
        </div>
        <div class="core">
            <div class="core-center" id="micBtn" onclick="activateAssistant()" aria-label="Microphone">🎙️</div>
        </div>
        <div class="status" id="statusText">سفیان بھائی، آپ کا جارویس آپ کی خدمت میں حاضر ہے!</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="यहाँ अपनी कमांड लिखें...">
            <button class="send-btn" onclick="sendQuery()">ارسال</button>
        </div>
        <div class="footer">
            MARK 40 JAVASCRIPT AI &copy; 2026
        </div>
    </div>

    <script>
        // یہاں اپنی اصلی جیمنائی اے پی آئی کی (API Key) درج کریں
        const GEMINI_API_KEY = "AQ.Ab8RN6JHN1vMoYbn34BMDwJeeXnUE4x4Y-p_vz6_ZUPlbVdEjA";

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ur-PK';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function setResponseText(text) {
            document.getElementById('statusText').innerText = text;
            speak(text);
        }

        async function queryGemini(prompt) {
            if (!GEMINI_API_KEY || GEMINI_API_KEY === "YAHAN_APNI_ASLI_API_KEY_LAGAYEIN") {
                throw new Error("GEMINI API key missing");
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "You are Jarvis, an AI assistant built for Sufian who lives in Haripur and works in Rawalpindi with furniture design. Respond in Urdu naturally and smartly to: " + prompt }] }]
                })
            });

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function sendQuery() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            setResponseText("پروسیسنگ جاری ہے...");
            try {
                const reply = await queryGemini(query);
                setResponseText(reply);
            } catch (err) {
                setResponseText("معذرت سفیان بھائی، اے پی آئی کی (API Key) کا مسئلہ ہے یا نیٹ ورک ایرر ہے۔");
            }
            input.value = "";
        }

        function activateAssistant() {
            setResponseText("جی سفیان بھائی، آپ کا جارویس سن رہا ہے، حکم دیجیے۔");
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ur-PK';
            recognition.onresult = async function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechToText;
                try {
                    const reply = await queryGemini(speechToText);
                    setResponseText(reply);
                } catch(e) {
                    setResponseText("معذرت سفیان بھائی، آواز پروسیس نہیں ہو سکی۔");
                }
            };
            recognition.start();
        }
    </script>
</body>
</html>
