<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK 40 - SUFYAN JARVIS AI</title>
    <style>
        body {
            background-color: #050b14;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 20px;
            text-align: center;
        }
        .chat-box {
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 20px;
            width: 85%;
            max-width: 400px;
            min-height: 120px;
            text-align: center;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mic-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #00ffff;
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 20px #00ffff;
        }
        .mic-btn {
            background: radial-gradient(circle, #00ffff 0%, #004466 100%);
            border: none;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px #00ffff;
            z-index: 2;
            font-size: 40px;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.45); opacity: 0; }
        }
        .status {
            margin-top: 25px;
            font-size: 15px;
            color: #88ccff;
        }
    </style>
</head>
<body>

    <h1>MARK 40 - SUFYAN JARVIS AI</h1>

    <div class="chat-box" id="responseBox">
        جی سفیان بھائی، آپ کی خدمت میں ہمیشہ حاضر ہوں، آج ہم کس پروجیکٹ پر کام کرنے والے ہیں؟
    </div>

    <div class="mic-container" onclick="activateJarvis()">
        <div class="pulse-ring"></div>
        <button class="mic-btn">🎙️</button>
    </div>

    <div class="status" id="statusText">سسٹم آن لائن ہے - آپ کے اشارے کی دیر ہے</div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6JHKRsI93U5QK3XkIlCvoxueRdFPS-zjAJYPFTY8M36xg";

        function speak(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ur-PK';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        function activateJarvis() {
            const status = document.getElementById('statusText');
            status.innerText = "سن رہا ہوں سفیان بھائی...";
            
            try {
                let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'ur-PK';
                recognition.interimResults = false;

                recognition.onresult = async (event) => {
                    let spokenText = event.results[0][0].transcript;
                    status.innerText = "پروسیسنگ ہو رہی ہے...";
                    await processQuery(spokenText);
                };

                recognition.onerror = () => {
                    status.innerText = "آواز کی شناخت نہیں ہو سکی، دوبارہ کوشش کریں۔";
                };

                recognition.start();
            } catch (e) {
                status.innerText = "براؤزر میں وائس ریکگنیشن سپورٹ موجود نہیں۔";
            }
        }

        async function processQuery(query) {
            const box = document.getElementById('responseBox');
            const status = document.getElementById('statusText');
            
            try {
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "You are Jarvis, an AI assistant built for Sufyan from Haripur who works in furniture design in Rawalpindi. Always talk like a caring friend and tech AI assistant in Urdu. User said: " + query }] }]
                    })
                });

                let data = await response.json();
                let reply = data.candidates[0].content.parts[0].text;
                
                box.innerText = reply;
                status.innerText = "سسٹم آن لائن ہے - آپ کے اشارے کی دیر ہے";
                speak(reply);
            } catch (error) {
                box.innerText = "معذرت سفیان بھائی، نیٹ ورک میں کوئی مسئلہ آگیا ہے۔";
                status.innerText = "خرابی کا سامنا ہے";
            }
        }
    </script>

</body>
</html>
