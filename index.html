<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark 40 - Jarvis Chat System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background-color: #050b14;
            color: #00ffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(0, 20, 40, 0.9);
            border-bottom: 2px solid #00ffff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 600px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 1rem;
        }
        .user-msg {
            background: rgba(0, 100, 150, 0.4);
            border: 1px solid #00ffff;
            align-self: flex-start;
            color: #fff;
        }
        .jarvis-msg {
            background: rgba(0, 30, 60, 0.9);
            border: 1px solid #00ffaa;
            align-self: flex-end;
            color: #00ffaa;
            box-shadow: 0 0 10px rgba(0,255,170,0.2);
        }
        footer {
            width: 100%;
            padding: 15px;
            background: rgba(0, 10, 20, 0.9);
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
        }
        input[type="text"] {
            width: 70%;
            padding: 12px;
            background: #020b14;
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            background: #00ffff;
            color: #050b14;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
    </style>
</head>
<body>

    <header>MARK 40 - JARVIS CHAT</header>

    <div id="chat-container">
        <div class="message jarvis-msg">سفیان بھائی، جارویس آن لائن ہے۔ اب پرانی کوئی بات ریپیٹ نہیں ہو گی، بتائیں کیا حکم ہے؟</div>
    </div>

    <footer>
        <input type="text" id="user-input" placeholder="یہاں اپنا سوال لکھیں...">
        <button onclick="sendMessage()">بھیجیں</button>
    </footer>

    <script>
        function speak(text) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ur-PK';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function appendMessage(text, sender) {
            let chatContainer = document.getElementById("chat-container");
            let msgDiv = document.createElement("div");
            msgDiv.className = "message " + (sender === 'user' ? 'user-msg' : 'jarvis-msg');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendMessage() {
            let inputField = document.getElementById("user-input");
            let text = inputField.value.trim();
            if (text === "") return;

            // صارف کا پیغام اسکرین پر دکھائیں
            appendMessage(text, 'user');
            inputField.value = "";

            // سمارٹ خودکار جواب جو کبھی بھی صارف کی بات کو کاپی نہیں کرے گا
            setTimeout(() => {
                let reply = "";
                let q = text.toLowerCase();

                if (q.includes("فون") || q.includes("موبایل") || q.includes("سام سنگ") || q.includes("ہزار")) {
                    reply = "سفیان بھائی، 30 سے 35 ہزار کے بجٹ میں سام سنگ یا انفنکس کے اچھے ماڈلز مل سکتے ہیں جو آپ کے کام کے لیے زبردست ہیں۔";
                } else if (q.includes("کھانا") || q.includes("طبیعت")) {
                    reply = "سفیان بھائی، میں بالکل ٹھیک ہوں۔ آپ راولپنڈی میں اپنے کام پر دھیان دیں اور ٹائم پر کھانا کھائیں۔";
                } else if (q.includes("شڈول") || q.includes("کام")) {
                    reply = "آپ کا شیڈول سیٹ ہے سر، صبح 8 بجے کام پر جانا اور رات 12 بجے چھٹی کرنا۔";
                } else {
                    reply = "سفیان بھائی، آپ کا یہ پوائنٹ مارک 40 سسٹم میں ریکارڈ ہو گیا ہے۔ اس پر ہم مزید بہتری لاتے ہیں، بتائیں اس میں کیا حکم ہے؟";
                }

                appendMessage(reply, 'jarvis');
                speak(reply);
            }, 600);
        }
    </script>
</body>
</html>
