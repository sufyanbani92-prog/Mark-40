    <!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark 40 - Jarvis Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050b14;
            color: #00ffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(0, 20, 40, 0.8);
            border-bottom: 2px solid #00ffff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            z-index: 10;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }
        .status-box {
            background: rgba(0, 30, 60, 0.9);
            border: 1px solid #00ffff;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .arc-reactor {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px dashed #00ffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, rgba(5,11,20,0.8) 70%);
            box-shadow: 0 0 25px #00ffff, inset 0 0 15px #00ffff;
            animation: pulse 2s infinite;
        }
        .arc-inner {
            width: 60px;
            height: 60px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px #00ffff; }
            50% { transform: scale(1.05); box-shadow: 0 0 30px #00ffff; }
            100% { transform: scale(1); box-shadow: 0 0 15px #00ffff; }
        }
        footer {
            width: 100%;
            padding: 15px;
            background: rgba(0, 20, 40, 0.9);
            display: flex;
            gap: 10px;
            border-top: 1px solid #00ffff;
            z-index: 10;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #030a12;
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 5px;
            outline: none;
            font-size: 1rem;
        }
        button.send-btn {
            background: #00ffff;
            color: #030a12;
            border: none;
            padding: 0 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>MARK 40 - JARVIS INTERFACE</header>

    <div class="main-container">
        <div id="status-box" class="status-box">
            سفیان سر، آرک رییکٹر آن لائن ہے۔ مائیک دبائیں یا کمانڈ دیں۔
        </div>

        <div class="arc-reactor" onclick="triggerJarvis()">
            <div class="arc-inner">🎙️</div>
        </div>
    </div>

    <footer>
        <input type="text" id="user-input" placeholder="یہاں کمانڈ لکھیں...">
        <button class="send-btn" onclick="sendText()">ارسال</button>
    </footer>

    <script>
        function speak(text) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ur-PK'; // اردو زبان
            window.speechSynthesis.speak(utterance);
        }

        function triggerJarvis() {
            speak("سفیان بھائی، جارویس آپ کی خدمت میں حاضر ہے۔ فرمائیے کیا حکم ہے؟");
            document.getElementById("status-box").innerText = "جارویس سن رہا ہے...";
            
            // وائس رికگنیشن شروع کرنا
            try {
                let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'ur-PK';
                recognition.onresult = function(event) {
                    let command = event.results[0][0].transcript;
                    document.getElementById("user-input").value = command;
                    document.getElementById("status-box").innerText = "موصول ہوا: " + command;
                    speak("آپ نے کہا: " + command);
                };
                recognition.start();
            } catch (e) {
                alert("سفیان سر، براؤزر میں وائس سپورٹ چیک کریں۔");
            }
        }

        function sendText() {
            let txt = document.getElementById("user-input").value;
            if(txt) {
                document.getElementById("status-box").innerText = "عمل جاری ہے: " + txt;
                speak("سفیان بھائی، آپ کا حکم مل گیا ہے، پروجیکٹ پر کام شروع ہے۔");
            }
        }
    </script>
</body>
</html>
