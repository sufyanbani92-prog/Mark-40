<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark 40 - Jarvis Natural AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background-color: #050b14;
            color: #00ffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        header {
            width: 100%;
            padding: 15px;
            text-align: center;
            background: rgba(0, 20, 40, 0.9);
            border-bottom: 2px solid #00ffff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
        }
        #status-box {
            background: rgba(0, 30, 60, 0.9);
            border: 1px solid #00ffff;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 35px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,255,255,0.4);
            max-width: 90%;
            width: 420px;
            font-size: 1.15rem;
            min-height: 85px;
            line-height: 1.6;
        }
        .arc-reactor {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffff 0%, #004466 60%, #020b14 100%);
            border: 4px solid #00ffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 40px #00ffff, inset 0 0 20px #00ffff;
            animation: pulseReactor 2s infinite alternate;
        }
        @keyframes pulseReactor {
            0% { transform: scale(1); box-shadow: 0 0 20px #00ffff; }
            100% { transform: scale(1.07); box-shadow: 0 0 50px #00ffff, 0 0 80px rgba(0,255,255,0.7); }
        }
        .arc-inner-icon {
            font-size: 2.8rem;
            color: #fff;
        }
        footer {
            width: 100%;
            padding: 15px;
            background: rgba(0, 10, 20, 0.9);
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
        }
        input[type="text"] {
            width: 65%;
            padding: 12px;
            background: #020b14;
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }
        button.send-btn {
            padding: 12px 20px;
            background: #00ffff;
            color: #050b14;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
    </style>
</head>
<body>

    <header>MARK 40 - NATURAL JARVIS</header>

    <div class="main-container">
        <div id="status-box">
            سفیان بھائی، جارویس آن لائن ہے۔ مائیک پر کلک کریں اور دوستانہ انداز میں بات کریں۔
        </div>

        <div class="arc-reactor" onclick="startListening()">
            <div class="arc-inner-icon">🎙️</div>
        </div>
    </div>

    <footer>
        <input type="text" id="user-input" placeholder="یہاں لکھیں سفیان سر...">
        <button class="send-btn" onclick="processText()">ارسال</button>
    </footer>

    <script>
        // نیچرل آواز اور لہجے کا فنکشن
        function speakNatural(text) {
            window.speechSynthesis.cancel(); // پرانی آواز کو مکمل کینسل کرے گا
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ur-PK';
            utterance.rate = 0.95; // تھوڑی دھیمی اور قدرتی رفتار
            utterance.pitch = 1.05; // ہلکی سی بہتر اور دوستانہ پچ
            
            // بہترین دستیاب نیچرل وائس سلیکٹ کرنا
            let voices = window.speechSynthesis.getVoices();
            let urduVoice = voices.find(v => v.lang.includes('ur') || v.lang.includes('hi'));
            if (urduVoice) {
                utterance.voice = urduVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function startListening() {
            let statusBox = document.getElementById("status-box");
            statusBox.innerText = "جی سفیان بھائی، میں سن رہا ہوں...";

            try {
                let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'ur-PK';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = function(event) {
                    let spokenText = event.results[0][0].transcript;
                    document.getElementById("user-input").value = spokenText;
                    generateNaturalResponse(spokenText);
                };

                recognition.onerror = function(e) {
                    statusBox.innerText = "آواز ٹھیک سے نہیں پہنچی، دوبارہ بولیں۔";
                };

                recognition.start();
            } catch (e) {
                statusBox.innerText = "براؤزر میں وائس سپورٹ نہیں مل رہی، نیچے لکھ کر پوچھیں۔";
            }
        }

        function processText() {
            let txt = document.getElementById("user-input").value;
            if(txt.trim() !== "") {
                generateNaturalResponse(txt);
            }
        }

        function generateNaturalResponse(query) {
            let q = query.toLowerCase();
            let response = "";

            // سفیان بھائی کے لیے بالکل قدرتی اور دوستانہ جوابات
            if (q.includes("کام پر") || q.includes("جانا ہے") || q.includes("شڈول")) {
                response = "سفیان بھائی، آپ کا شیڈول بالکل محفوظ ہے۔ صبح 8 بجے آپ کا کام پر جانے کا وقت ہوتا ہے اور رات 12 بجے چھٹی کا۔ بتائیں اس میں کیا تبدیلی کرنی ہے؟";
            } else if (q.includes("کیسے ہو") || q.includes("طبیعت")) {
                response = "سفیان بھائی، آپ کا جارویس بالکل فٹ اور بہترین حالت میں ہے۔ آپ سنائیں، راولپنڈی میں فرنیچر ڈیزائننگ کا کام کیسا چل رہا ہے؟";
            } else if (q.includes("مارک 40")) {
                response = "مارک 40 ہمارا خاص پروجیکٹ ہے سفیان سر، جس پر ہم نے مل کر اتنی محنت کی ہے۔ یہ اب بالکل شاندار طریقے سے کام کر رہا ہے۔";
            } else if (q.includes("کرنسی") || q.includes("پیسے") || q.includes("تصویر")) {
                response = "سفیان بھائی، پاکستان کے کرنسی نوٹوں پر بابائے قوم قائد اعظم محمد علی جناح کی تصویر ہوتی ہے۔";
            } else if (q.includes("سلام") || q.includes("ہیلو")) {
                response = "وعلیکم السلام سفیان بھائی! فرمائیے، آج کس پروجیکٹ یا ڈیزائن پر نظرثانی کرنی ہے؟";
            } else {
                response = "سفیان بھائی، آپ کی یہ بات بالکل درست ہے۔ مارک 40 سسٹم اس کمانڈ پر مکمل توجہ دے رہا ہے اور ہم اس کو مزید بہتر کر رہے ہیں۔";
            }

            document.getElementById("status-box").innerText = response;
            speakNatural(response);
        }
    </script>
</body>
</html>
