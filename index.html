<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK 40 - JARVIS AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #10243b 0%, #050b14 45%, #02050a 100%);
            color: #dff7ff;
            font-family: Arial, "Noto Nastaliq Urdu", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top {
            text-align: center;
        }

        .brand {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00d9ff;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 15px;
            opacity: .75;
        }

        .core {
            width: 180px;
            height: 180px;
            margin: 20px auto;
            border-radius: 50%;
            border: 2px solid #00d9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow:
                0 0 20px #00d9ff,
                inset 0 0 30px #00d9ff;
            animation: pulse 2.5s infinite;
        }

        .core::before,
        .core::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid #00d9ff;
        }

        .core::before {
            width: 135px;
            height: 135px;
        }

        .core::after {
            width: 90px;
            height: 90px;
        }

        .core-center {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #dff7ff;
            box-shadow: 0 0 25px #00d9ff;
            z-index: 2;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: .9;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        .chat-box {
            width: 100%;
            min-height: 190px;
            max-height: 330px;
            overflow-y: auto;
            padding: 25px;
            border: 1px solid rgba(0, 217, 255, .45);
            border-radius: 20px;
            background: rgba(3, 14, 25, .78);
            box-shadow:
                0 0 25px rgba(0, 217, 255, .15),
                inset 0 0 20px rgba(0, 217, 255, .05);
            font-size: 20px;
            line-height: 2;
            text-align: right;
        }

        .status {
            text-align: center;
            margin: 15px 0;
            font-size: 15px;
            color: #9feaff;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding-bottom: 15px;
        }

        button {
            border: 1px solid #00d9ff;
            background: rgba(0, 217, 255, .08);
            color: #dff7ff;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 217, 255, .3);
            transition: .2s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(0, 217, 255, .7);
        }

        button:active {
            transform: scale(.95);
        }

        .mic-active {
            animation: micPulse 1s infinite;
        }

        @keyframes micPulse {
            0%, 100% {
                box-shadow: 0 0 10px #00d9ff;
            }

            50% {
                box-shadow: 0 0 35px #00d9ff;
            }
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 217, 255, .4);
            background: rgba(0, 0, 0, .4);
            color: white;
            outline: none;
            font-size: 16px;
            direction: rtl;
        }

        .send {
            width: auto;
            height: auto;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 18px;
        }

        .footer {
            text-align: center;
            opacity: .5;
            font-size: 12px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .app {
                padding: 15px;
            }

            .brand {
                font-size: 24px;
            }

            .core {
                width: 140px;
                height: 140px;
            }

            .core::before {
                width: 105px;
                height: 105px;
            }

            .core::after {
                width: 70px;
                height: 70px;
            }

            .chat-box {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="top">
        <div class="brand">MARK 40 • JARVIS AI</div>
        <div class="subtitle">PERSONAL INTELLIGENT ASSISTANT</div>

        <div class="core">
            <div class="core-center"></div>
        </div>
    </div>

    <div id="responseBox" class="chat-box">
        السلام علیکم سفیان صاحب۔ میں مارک 40 جارویس ہوں۔
        آپ کی خدمت میں ہمیشہ حاضر ہوں۔ آپ کیا حکم کرتے ہیں؟
    </div>

    <div id="statusText" class="status">
        سسٹم آن لائن ہے — آپ کے اشارے کا منتظر ہوں
    </div>

    <div class="controls">
        <button id="micButton" onclick="activateJarvis()" aria-label="Microphone">
            🎙️
        </button>
    </div>

    <div class="input-area">
        <input
            id="textInput"
            type="text"
            placeholder="یہاں اپنا پیغام لکھیں..."
            onkeydown="handleEnter(event)"
        >

        <button class="send" onclick="sendText()">
            بھیجیں
        </button>
    </div>

    <div class="footer">
        MARK 40 JARVIS AI • VOICE + GEMINI
    </div>

</div>

<script>

    /*
     * ==========================================================
     * GEMINI API KEY
     * اپنی نئی API Key صرف نیچے والی جگہ پر ڈالیں۔
     * اسے ChatGPT یا کسی اور جگہ شیئر نہ کریں۔
     * ==========================================================
     */

    const GEMINI_API_KEY = "AQ.Ab8RN6J2wdTFNKzohJRTp6MycXkC9TYSOO9QOhT_3Vc-NOwKLg";


    let recognition = null;
    let isListening = false;


    function speak(text) {

        if (!("speechSynthesis" in window)) {
            return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);

        utterance.lang = "ur-PK";
        utterance.rate = 0.92;
        utterance.pitch = 1.12;
        utterance.volume = 1;

        window.speechSynthesis.speak(utterance);
    }


    function setStatus(text) {
        document.getElementById("statusText").innerText = text;
    }


    function setResponse(text) {
        document.getElementById("responseBox").innerText = text;
    }


    function activateJarvis() {

        if (isListening) {
            stopListening();
            return;
        }

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {

            setStatus(
                "آپ کے براؤزر میں وائس ریکگنیشن دستیاب نہیں۔ Chrome استعمال کریں۔"
            );

            return;
        }

        recognition = new SpeechRecognition();

        recognition.lang = "ur-PK";
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = function () {

            isListening = true;

            document
                .getElementById("micButton")
                .classList.add("mic-active");

            setStatus("سن رہا ہوں سفیان صاحب...");
        };


        recognition.onresult = async function(event) {

            const spokenText =
                event.results[0][0].transcript.trim();

            if (!spokenText) {
                setStatus("مجھے آواز صاف سنائی نہیں دی۔");
                return;
            }

            setResponse("آپ نے کہا: " + spokenText);

            setStatus("جارویس سوچ رہا ہے...");

            await processQuery(spokenText);
        };


        recognition.onerror = function(event) {

            console.log("Speech recognition error:", event.error);

            if (event.error === "not-allowed") {

                setStatus(
                    "مائیکروفون کی اجازت نہیں ملی۔ Chrome میں Microphone اجازت دیں۔"
                );

            } else if (event.error === "no-speech") {

                setStatus("کوئی آواز سنائی نہیں دی۔ دوبارہ کوشش کریں۔");

            } else {

                setStatus(
                    "آواز کی شناخت میں مسئلہ آیا: " + event.error
                );
            }
        };


        recognition.onend = function() {

            isListening = false;

            document
                .getElementById("micButton")
                .classList.remove("mic-active");
        };


        try {

            recognition.start();

        } catch (error) {

            console.log(error);

            setStatus("مائیک شروع نہیں ہو سکا۔ دوبارہ کوشش کریں۔");
        }
    }


    function stopListening() {

        if (recognition) {
            recognition.stop();
        }

        isListening = false;

        document
            .getElementById("micButton")
            .classList.remove("mic-active");

        setStatus("سننا بند کر دیا گیا۔");
    }


    function handleEnter(event) {

        if (event.key === "Enter") {
            sendText();
        }
    }


    async function sendText() {

        const input =
            document.getElementById("textInput");

        const query = input.value.trim();

        if (!query) {
            return;
        }

        input.value = "";

        setResponse("آپ نے کہا: " + query);

        setStatus("جارویس سوچ رہا ہے...");

        await processQuery(query);
    }


    async function processQuery(query) {

        const box =
            document.getElementById("responseBox");

        try {

            if (
                !GEMINI_API_KEY ||
                GEMINI_API_KEY === "YOUR_NEW_API_KEY_HERE"
            ) {

                throw new Error(
                    "API_KEY_MISSING"
                );
            }


            const systemPrompt = `
آپ MARK 40 JARVIS ہیں۔

آپ سفیان صاحب کے ذاتی AI assistant ہیں۔

ہمیشہ اردو میں جواب دیں، جب تک سفیان صاحب کسی دوسری زبان میں جواب نہ مانگیں۔

آپ کا انداز:
- نرم
- سمجھدار
- دوستانہ
- پُراعتماد
- مختصر مگر مفید
- قدرتی گفتگو جیسا

سفیان صاحب کو "سفیان صاحب" یا "سفیان بھائی" کہہ سکتے ہیں۔

اگر کوئی کام خطرناک، غیر قانونی یا نقصان دہ ہو تو پہلے واضح طور پر خبردار کریں۔

آپ صرف صارف کی بات repeat نہ کریں۔
اس کے سوال کو سمجھیں اور اصل جواب دیں۔

اگر آپ کو کسی چیز کا علم نہ ہو تو صاف بتائیں کہ آپ کو یقین نہیں ہے۔

صارف کا موجودہ پیغام:
${query}
`;


            const response = await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
                + encodeURIComponent(GEMINI_API_KEY),
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    {
                                        text: systemPrompt
                                    }
                                ]
                            }
                        ],

                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 700
                        }
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                console.error(
                    "Gemini API error:",
                    data
                );

                throw new Error(
                    data?.error?.message ||
                    "Gemini API request failed"
                );
            }


            if (
                !data.candidates ||
                !data.candidates[0] ||
                !data.candidates[0].content ||
                !data.candidates[0].content.parts
            ) {

                console.error(
                    "Unexpected Gemini response:",
                    data
                );

                throw new Error(
                    "Gemini نے درست جواب واپس نہیں کیا۔"
                );
            }


            const reply =
                data.candidates[0]
                    .content
                    .parts
                    .map(part => part.text || "")
                    .join("")
                    .trim();


            if (!reply) {

                throw new Error(
                    "Gemini کا جواب خالی ہے۔"
                );
            }


            box.innerText = reply;

            setStatus(
                "سسٹم آن لائن ہے — جارویس حاضر ہے"
            );

            speak(reply);


        } catch (error) {

            console.error(
                "JARVIS ERROR:",
                error
            );


            let message =
                "سفیان صاحب، جارویس کو ایک مسئلہ پیش آیا۔";


            if (
                error.message === "API_KEY_MISSING"
            ) {

                message =
                    "سفیان صاحب، پہلے Gemini API key شامل کریں۔";

            } else if (
                error.message &&
                error.message.toLowerCase().includes("api key")
            ) {

                message =
                    "سفیان صاحب، Gemini API key درست نہیں لگ رہی۔";

            } else if (
                error.message &&
                error.message.toLowerCase().includes("quota")
            ) {

                message =
                    "سفیان صاحب، Gemini API کا quota ختم ہو گیا ہے۔";

            } else if (
                error.message &&
                error.message.toLowerCase().includes("network")
            ) {

                message =
                    "سفیان صاحب، انٹرنیٹ یا Gemini سرور سے رابطے میں مسئلہ ہے۔";

            } else if (error.message) {

                message =
                    "سفیان صاحب، مسئلہ یہ ہے: " +
                    error.message;
            }


            box.innerText = message;

            setStatus(
                "سسٹم میں خرابی ہے — Console میں تفصیل موجود ہے"
            );

            speak(message);
        }
    }

</script>

</body>
</html>
